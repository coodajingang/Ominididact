[project]
name = "ai-jh-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0,<1.0.0",
    "httpx>=0.24.0,<1.0.0",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.6",
    "python-pptx>=0.6.21",
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "uvicorn>=0.20.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

