version: '3.8'

services:
  omnididact:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnididact:latest
    container_name: omnididact
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      - HOST=0.0.0.0
      - PORT=8000
