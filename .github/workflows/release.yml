name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python Dependencies & Verify Tests with uv
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s test

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Distribution Archives
        run: |
          chmod +x pack.sh
          ./pack.sh ${{ github.ref_name }}
          sha256sum omnididact-${{ github.ref_name }}.zip > SHA256SUMS.txt
          sha256sum omnididact-${{ github.ref_name }}.tar.gz >> SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omnididact-${{ github.ref_name }}.zip
            omnididact-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
