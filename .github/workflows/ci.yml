name: CI - Build & Test

on:
  push:
    branches: [ main, master, release-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests (uv / Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies with uv
        run: |
          uv sync --frozen

      - name: Run Test Suite
        run: |
          uv run python -m unittest discover -s test
          uv run python test/test_study_service.py
          uv run python test/test_study_api.py
          uv run python test/test_flashcard_service.py
          uv run python test/test_e2e_study.py

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Artifacts
        working-directory: frontend
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f frontend/dist/index.html || { echo "frontend/dist/index.html missing!"; exit 1; }
          echo "Frontend build successfully verified."
