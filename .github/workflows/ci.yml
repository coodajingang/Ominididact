name: CI - Build & Test

on:
  push:
    branches: [ main, master, release-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run Test Suite
        run: |
          python -m unittest discover -s test
          python test/test_study_api.py
          python test/test_flashcard_service.py
          python test/test_e2e_study.py

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Artifacts
        working-directory: frontend
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f frontend/dist/index.html || { echo "frontend/dist/index.html missing!"; exit 1; }
          echo "Frontend build successfully verified."
